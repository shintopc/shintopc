<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#136C61"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="92" height="92" rx="26" fill="url(#vaultGrad)" stroke="rgba(94, 234, 212, 0.4)" stroke-width="2"/>

  <!-- Subtle Inner Vault Ring -->
  <circle cx="54" cy="54" r="38" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-dasharray="6 4"/>

  <!-- Shackle (Arch) -->
  <path d="M38 48 V38 A16 16 0 0 1 70 38 V48" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Padlock Body with Vault Chamfers -->
  <rect x="32" y="46" width="44" height="34" rx="8" fill="#FFFFFF"/>

  <!-- Cyber Keyhole & Core -->
  <circle cx="54" cy="60" r="5" fill="#136C61"/>
  <path d="M51.5 61 L49.5 72 H58.5 L56.5 61 Z" fill="#136C61"/>
  <circle cx="54" cy="60" r="3" fill="#5eead4" filter="url(#glow)"/>

  <!-- Sync Ring Accents -->
  <path d="M26 36 A32 32 0 0 1 42 22" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M82 72 A32 32 0 0 1 66 86" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
